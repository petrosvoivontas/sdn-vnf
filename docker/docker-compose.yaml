name: 'mininet_vnf'

services:
    vnf_nat:
        image: vnf_nat:0.0.3
        container_name: vnf_nat
        stdin_open: true
        tty: true
        cap_add:
            - NET_ADMIN
            - NET_RAW
        environment:
            - NAT_INTF=eth0
    dns_nat:
        image: coredns/coredns
        container_name: vnf_dns
        cap_add:
            - NET_ADMIN
        volumes:
            - ${PWD}/Corefile:/etc/coredns/Corefile
